<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Performance — SMARTACADEMIC Lecturer</title>
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/topbar.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
</head>
<body>

  <div class="app-shell">
    <div id="sidebarSlot"></div>
    <div class="main">
      <div id="topbarSlot"></div>
      <main class="page">

        <div class="page-header">
          <div>
            <h1>Performance Analytics</h1>
            <p>Student performance across your courses.</p>
          </div>
          <div class="page-actions">
            <select class="select" id="courseFilter" style="max-width:280px;">
              <option value="">All courses</option>
            </select>
          </div>
        </div>

        <div class="card chart-card mb-4">
          <div class="card-header"><div><h3>Score Distribution</h3><p>Per course average</p></div></div>
          <div class="chart-wrap"><canvas id="perfChart"></canvas></div>
        </div>

        <div class="card">
          <div class="card-header"><div><h3>Student Averages</h3></div></div>
          <div class="table-wrap" style="box-shadow:none;border:none;">
            <table class="table">
              <thead>
                <tr>
                  <th>Student</th>
                  <th>Matric</th>
                  <th>Course</th>
                  <th style="text-align:right;">Avg Score</th>
                  <th style="text-align:right;">Grade</th>
                </tr>
              </thead>
              <tbody id="studentPerfBody">
                <tr><td colspan="5"><div class="skeleton" style="height:22px;"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="/js/sidebar.js"></script>
  <script src="/js/topbar.js"></script>
  <script src="/js/admin/crud-shared.js"></script>
  <script>
    'use strict';
    (function () {
      const { $, api, esc } = window.SACrud;

      async function loadCourses() {
        const { ok, data } = await api('/api/lecturer/courses');
        if (!ok) return;
        $('#courseFilter').innerHTML = '<option value="">All courses</option>' +
          data.data.map(c => `<option value="${c.id}">${esc(c.code)} — ${esc(c.title)}</option>`).join('');
      }

      async function loadPerformance() {
        const { ok, data } = await api('/api/lecturer/reports/course-performance');
        if (!ok) return;
        const rows = data.data;

        // Table of student averages
        const studRes = await api('/api/lecturer/reports/student-averages' + ($('#courseFilter').value ? '?course_id=' + $('#courseFilter').value : ''));
        const body = $('#studentPerfBody');
        if (studRes.ok && studRes.data.data.length) {
          const gradeBadge = g => ({ A: 'green', B: 'blue', C: 'blue', D: 'yellow', E: 'yellow', F: 'red' }[g] || 'gray');
          body.innerHTML = studRes.data.data.slice(0, 100).map(r => `
            <tr>
              <td>${esc(r.full_name)}</td>
              <td>${esc(r.matric_no)}</td>
              <td>${esc(r.code)}</td>
              <td style="text-align:right;"><strong>${parseFloat(r.total_score || 0).toFixed(1)}</strong></td>
              <td style="text-align:right;"><span class="badge badge-${gradeBadge(r.grade)}">${esc(r.grade || '—')}</span></td>
            </tr>`).join('');
        } else {
          body.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:30px;color:var(--ink-3);">No results yet.</td></tr>';
        }

        // Chart
        const canvas = $('#perfChart');
        if (!canvas || typeof Chart === 'undefined') return;
        if (!rows.length) {
          canvas.parentElement.innerHTML = '<div class="empty" style="padding:40px;"><div class="empty-icon">📊</div><h3>No data yet</h3></div>';
          return;
        }
        new Chart(canvas, {
          type: 'bar',
          data: {
            labels: rows.map(r => r.code),
            datasets: [{
              label: 'Avg Score',
              data: rows.map(r => parseFloat(r.avg_score) || 0),
              backgroundColor: '#166534',
              borderRadius: 8,
            }],
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            scales: { y: { beginAtZero: true, max: 100, grid: { color: '#f1f5f9' } }, x: { grid: { display: false } } },
            plugins: { legend: { display: false } },
          },
        });
      }

      document.addEventListener('sa:layout-ready', () => {
        loadCourses();
        loadPerformance();
        $('#courseFilter').addEventListener('change', loadPerformance);
      });
    })();
  </script>
</body>
</html>
