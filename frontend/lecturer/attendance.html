<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance — Lecturer</title>
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/topbar.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebarSlot"></div>
    <div class="main">
      <div id="topbarSlot"></div>
      <main class="page">
        <div class="page-header">
          <div><h1>Attendance</h1><p>Record and manage class attendance.</p></div>
          <div class="page-actions">
            <button class="btn btn-primary" id="btnNewSession">+ New Class Session</button>
          </div>
        </div>

        <div class="filters">
          <select class="select" id="courseFilter" style="max-width:320px;"><option value="">Select course</option></select>
        </div>

        <div id="sessionsWrap">
          <div class="empty" style="padding:60px 20px;">
            <div class="empty-icon">📅</div>
            <h3>Select a course</h3>
            <p>Choose a course to view or record attendance.</p>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div id="modalRoot"></div>
  <script src="/js/sidebar.js"></script>
  <script src="/js/topbar.js"></script>
  <script src="/js/admin/crud-shared.js"></script>
  <script src="/js/lecturer/attendance.js"></script>
</body>
</html>
