<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Students — SMARTACADEMIC Lecturer</title>
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/topbar.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>

  <div class="app-shell">
    <div id="sidebarSlot"></div>
    <div class="main">
      <div id="topbarSlot"></div>
      <main class="page">

        <div class="page-header">
          <div>
            <h1>My Students</h1>
            <p>All students registered in courses you teach.</p>
          </div>
        </div>

        <div class="filters">
          <select class="select" id="courseFilter" style="max-width:320px;">
            <option value="">All my courses</option>
          </select>
          <div class="search"><input type="search" id="searchInput" placeholder="Search by name or matric..." /></div>
          <button class="btn btn-ghost btn-sm" id="btnReset">Reset</button>
        </div>

        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>Student</th>
                <th>Matric</th>
                <th>Level</th>
                <th>Course</th>
                <th>Risk</th>
                <th style="text-align:right;">Actions</th>
              </tr>
            </thead>
            <tbody id="tbody">
              <tr><td colspan="6"><div class="skeleton" style="height:22px;"></div></td></tr>
            </tbody>
          </table>
        </div>

      </main>
    </div>
  </div>

  <div id="modalRoot"></div>

  <script src="/js/sidebar.js"></script>
  <script src="/js/topbar.js"></script>
  <script src="/js/admin/crud-shared.js"></script>
  <script>
    'use strict';
    (function () {
      const { $, api, esc, initials, openModal } = window.SACrud;
      const state = { course_id: '', search: '' };

      async function loadCourses() {
        const { ok, data } = await api('/api/lecturer/courses');
        if (!ok) return;
        $('#courseFilter').innerHTML = '<option value="">All my courses</option>' +
          data.data.map(c => `<option value="${c.id}">${esc(c.code)} — ${esc(c.title)}</option>`).join('');
      }

      async function load() {
        $('#tbody').innerHTML = '<tr><td colspan="6"><div class="skeleton" style="height:22px;"></div></td></tr>';
        const p = new URLSearchParams();
        if (state.course_id) p.set('course_id', state.course_id);
        if (state.search) p.set('search', state.search);

        const { ok, data } = await api('/api/lecturer/students?' + p.toString());
        if (!ok) { $('#tbody').innerHTML = '<tr><td colspan="6" style="text-align:center;padding:30px;color:var(--red);">Failed.</td></tr>'; return; }
        if (!data.data.length) {
          $('#tbody').innerHTML = '<tr><td colspan="6"><div class="empty" style="padding:40px;"><div class="empty-icon">🎓</div><h3>No students</h3><p>No students are registered in your courses yet.</p></div></td></tr>';
          return;
        }
        $('#tbody').innerHTML = data.data.map(s => {
          const cls = (s.risk_category || 'GREEN').toLowerCase();
          return `
            <tr>
              <td><div style="display:flex;align-items:center;gap:10px;">
                <span class="profile-avatar" style="width:32px;height:32px;font-size:12px;">${esc(initials(s.full_name))}</span>
                <div><div style="font-weight:600;">${esc(s.full_name)}</div>
                <div style="font-size:12px;color:var(--ink-3);">${esc(s.email)}</div></div>
              </div></td>
              <td>${esc(s.matric_no)}</td>
              <td><span class="badge badge-blue">${s.level}</span></td>
              <td>${esc(s.course_code || '—')}</td>
              <td><span class="badge badge-${cls}"><span class="risk-dot ${cls}"></span>${s.risk_category || 'GREEN'}</span></td>
              <td><div class="actions">
                <button class="btn btn-ghost btn-sm" data-view="${s.id}">View</button>
              </div></td>
            </tr>`;
        }).join('');
        $('#tbody').querySelectorAll('[data-view]').forEach(b =>
          b.addEventListener('click', () => openDetail(parseInt(b.dataset.view, 10))));
      }

      async function openDetail(id) {
        // Use HOD's student detail endpoint (works for lecturer too because
        // it just queries the student's info + attendance + risk)
        const { ok, data } = await api('/api/lecturer/student/' + id);
        if (!ok) { alert('Failed to load details'); return; }

        const { student, attendance, risk, results } = data.data;

        openModal({
          title: student.full_name,
          subtitle: `${student.matric_no} · Level ${student.level}`,
          size: 'lg',
          confirmText: 'Close',
          body: `
            <div class="grid-3" style="gap:12px;margin-bottom:20px;">
              <div><div style="font-size:12px;color:var(--ink-3);">Attendance</div><strong>${attendance?.pct || 0}%</strong></div>
              <div><div style="font-size:12px;color:var(--ink-3);">Risk</div>
                ${risk ? `<span class="badge badge-${risk.risk_category.toLowerCase()}">${risk.risk_category}</span>` : '—'}
              </div>
              <div><div style="font-size:12px;color:var(--ink-3);">Results</div><strong>${results?.length || 0}</strong></div>
            </div>
            ${results && results.length ? `
              <h4 style="font-size:13px;margin-bottom:8px;">Recent Results</h4>
              <div class="table-wrap" style="box-shadow:none;">
                <table class="table">
                  <thead><tr><th>Course</th><th>Score</th><th>Grade</th></tr></thead>
                  <tbody>
                    ${results.slice(0, 10).map(r => `
                      <tr>
                        <td>${esc(r.code)} — ${esc(r.title)}</td>
                        <td>${parseFloat(r.total_score || 0).toFixed(1)}</td>
                        <td><span class="badge badge-${r.grade === 'A' ? 'green' : r.grade === 'F' ? 'red' : 'blue'}">${r.grade || '—'}</span></td>
                      </tr>`).join('')}
                  </tbody>
                </table>
              </div>` : '<p style="color:var(--ink-3);text-align:center;">No results yet.</p>'}
          `,
          onConfirm: (_b, close) => close(),
        });
      }

      function bind() {
        $('#courseFilter').addEventListener('change', e => { state.course_id = e.target.value; load(); });
        let t;
        $('#searchInput').addEventListener('input', e => {
          clearTimeout(t);
          t = setTimeout(() => { state.search = e.target.value.trim(); load(); }, 300);
        });
        $('#btnReset').addEventListener('click', () => {
          state.course_id = ''; state.search = '';
          $('#courseFilter').value = ''; $('#searchInput').value = '';
          load();
        });
      }

      document.addEventListener('sa:layout-ready', () => {
        loadCourses();
        bind();
        load();
      });
    })();
  </script>
</body>
</html>
