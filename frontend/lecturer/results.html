<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Results — SMARTACADEMIC Lecturer</title>
  <link rel="icon" type="image/png" href="/assets/images/fpu-logo.png" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/topbar.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <style>
    .cb-cell { width: 44px; text-align: center; }
    .cb-cell input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary); }
    .bulk-bar {
      display: none; align-items: center; gap: 12px; padding: 12px 18px;
      background: linear-gradient(135deg, #f0fdf4, #dcfce7);
      border: 1px solid #bbf7d0; border-radius: 12px; margin-bottom: 16px;
    }
    .bulk-bar.active { display: flex; }
    .bulk-bar .bulk-info { flex: 1; font-size: 14px; color: #166534; font-weight: 600; }
    .pill-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .pill {
      padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 700;
      border: 1px solid var(--border); background: #fff; color: var(--ink-3);
      cursor: pointer; transition: .15s;
    }
    .pill:hover { border-color: var(--primary); color: var(--primary); }
    .pill.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .pill .cnt {
      display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px;
      background: var(--bg-3); font-size: 11px; color: var(--ink-3);
    }
    .pill.active .cnt { background: rgba(255,255,255,.3); color: #fff; }
  </style>
</head>
<body>

  <div class="app-shell">
    <div id="sidebarSlot"></div>
    <div class="main">
      <div id="topbarSlot"></div>
      <main class="page">

        <div class="page-header">
          <div>
            <h1>Results</h1>
            <p>Select courses and submit their results to your HOD for approval.</p>
          </div>
          <div class="page-actions">
            <button class="btn btn-ghost" id="btnPrint">🖨️ Print</button>
            <button class="btn btn-ghost" id="btnExport">📊 Export</button>
          </div>
        </div>

        <div class="msg msg-info show" style="margin-bottom:18px;line-height:1.6;">
          <strong>ℹ️ Workflow:</strong> Check courses you've finished marking, then click
          <strong>📤 Submit Selected to HOD</strong>. All selected results go to the HOD in one action.
        </div>

        <!-- Status filter pills -->
        <div class="pill-row">
          <button class="pill active" data-status="all">All <span class="cnt" id="cAll">0</span></button>
          <button class="pill" data-status="draft">Draft <span class="cnt" id="cDraft">0</span></button>
          <button class="pill" data-status="submitted">Submitted <span class="cnt" id="cSubmitted">0</span></button>
          <button class="pill" data-status="approved">Approved <span class="cnt" id="cApproved">0</span></button>
          <button class="pill" data-status="returned">Returned <span class="cnt" id="cReturned">0</span></button>
        </div>

        <div class="bulk-bar" id="bulkBar">
          <div class="bulk-info">
            <strong id="bulkCount">0</strong> course(s) selected
          </div>
          <button class="btn btn-primary btn-sm" id="btnBulkSubmit">📤 Submit Selected to HOD</button>
          <button class="btn btn-ghost btn-sm" id="btnBulkClear">Clear</button>
        </div>

        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th class="cb-cell"><input type="checkbox" id="checkAll" title="Select all eligible" /></th>
                <th>Course</th>
                <th>Session</th>
                <th>Semester</th>
                <th>Students</th>
                <th>Status</th>
                <th style="text-align:right;">Details</th>
              </tr>
            </thead>
            <tbody id="tbody">
              <tr><td colspan="7"><div class="skeleton" style="height:22px;"></div></td></tr>
            </tbody>
          </table>
        </div>

      </main>
    </div>
  </div>

  <script src="/js/sidebar.js"></script>
  <script src="/js/topbar.js"></script>
  <script src="/js/admin/crud-shared.js"></script>
  <script src="/js/lecturer/results.js"></script>
</body>
</html>
