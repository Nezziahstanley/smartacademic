<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Results — SMARTACADEMIC Lecturer</title>
  <link rel="icon" type="image/png" href="/assets/images/fpu-logo.png" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/topbar.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>

  <div class="app-shell">
    <div id="sidebarSlot"></div>
    <div class="main">
      <div id="topbarSlot"></div>
      <main class="page">

        <div class="page-header">
          <div>
            <h1>Results</h1>
            <p>Review computed results for your courses and submit them to the HOD for approval.</p>
          </div>
        </div>

        <div class="msg msg-info show" style="margin-bottom:18px;line-height:1.6;">
          <strong>ℹ️ Workflow:</strong> Review the results below, then click
          <strong>📤 Submit to HOD</strong> for each course. The HOD will approve or return them.
          Once approved, the admin publishes them for students.
        </div>

        <div class="filters">
          <select class="select" id="courseFilter" style="max-width:320px;">
            <option value="">All my courses</option>
          </select>
          <button class="btn btn-ghost btn-sm" id="btnReset">Reset</button>
        </div>

        <div id="resultsWrap">
          <div class="skeleton" style="height:100px;"></div>
        </div>

      </main>
    </div>
  </div>

  <script src="/js/sidebar.js"></script>
  <script src="/js/topbar.js"></script>
  <script src="/js/admin/crud-shared.js"></script>
  <script src="/js/lecturer/results.js"></script>
</body>
</html>
