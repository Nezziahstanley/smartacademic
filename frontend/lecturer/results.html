<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Results — Lecturer</title>
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/topbar.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebarSlot"></div>
    <div class="main">
      <div id="topbarSlot"></div>
      <main class="page">
        <div class="page-header"><div><h1>Results</h1><p>Results for your courses.</p></div></div>

        <div class="filters">
          <select class="select" id="courseFilter" style="max-width:320px;"><option value="">All courses</option></select>
        </div>

        <div class="table-wrap">
          <table class="table">
            <thead><tr>
              <th>Student</th><th>Course</th><th>CA</th><th>Exam</th><th>Total</th><th>Grade</th>
            </tr></thead>
            <tbody id="tbody"><tr><td colspan="6"><div class="skeleton" style="height:22px;"></div></td></tr></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>
  <script src="/js/sidebar.js"></script>
  <script src="/js/topbar.js"></script>
  <script src="/js/admin/crud-shared.js"></script>
  <script src="/js/lecturer/results.js"></script>
</body>
</html>
