<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Results — SMARTACADEMIC Lecturer</title>
  <link rel="icon" type="image/png" href="/assets/images/fpu-logo.png" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/topbar.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <style>
    .cb-cell { width: 44px; text-align: center; }
    .cb-cell input[type="checkbox"] {
      width: 18px; height: 18px; cursor: pointer;
      accent-color: var(--primary);
    }
    .bulk-bar {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      background: linear-gradient(135deg, #f0fdf4, #dcfce7);
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .bulk-bar.active { display: flex; }
    .bulk-bar .bulk-info {
      flex: 1;
      font-size: 14px;
      color: #166534;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <div id="sidebarSlot"></div>
    <div class="main">
      <div id="topbarSlot"></div>
      <main class="page">

        <div class="page-header">
          <div>
            <h1>Results</h1>
            <p>Select courses and submit their results to your HOD for approval.</p>
          </div>
        </div>

        <div class="msg msg-info show" style="margin-bottom:18px;line-height:1.6;">
          <strong>ℹ️ Workflow:</strong> Check the courses you've finished marking, then click
          <strong>📤 Submit Selected to HOD</strong>. All selected results go to the HOD in one action.
        </div>

        <div class="bulk-bar" id="bulkBar">
          <div class="bulk-info">
            <strong id="bulkCount">0</strong> course(s) selected
          </div>
          <button class="btn btn-primary btn-sm" id="btnBulkSubmit">
            📤 Submit Selected to HOD
          </button>
          <button class="btn btn-ghost btn-sm" id="btnBulkClear">Clear</button>
        </div>

        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th class="cb-cell">
                  <input type="checkbox" id="checkAll" title="Select all eligible" />
                </th>
                <th>Course</th>
                <th>Session</th>
                <th>Semester</th>
                <th>Students</th>
                <th>Status</th>
                <th style="text-align:right;">Details</th>
              </tr>
            </thead>
            <tbody id="tbody">
              <tr><td colspan="7"><div class="skeleton" style="height:22px;"></div></td></tr>
            </tbody>
          </table>
        </div>

      </main>
    </div>
  </div>

  <script src="/js/sidebar.js"></script>
  <script src="/js/topbar.js"></script>
  <script src="/js/admin/crud-shared.js"></script>
  <script src="/js/lecturer/results.js"></script>
</body>
</html>
