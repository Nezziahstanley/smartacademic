<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assessments — Lecturer</title>
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/topbar.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <style>
    .pill-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .pill {
      padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 700;
      border: 1px solid var(--border); background: #fff; color: var(--ink-3);
      cursor: pointer; transition: .15s;
    }
    .pill:hover { border-color: var(--primary); color: var(--primary); }
    .pill.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebarSlot"></div>
    <div class="main">
      <div id="topbarSlot"></div>
      <main class="page">

        <div class="page-header">
          <div><h1>Assessments</h1><p>Create assessments and enter student scores.</p></div>
          <div class="page-actions">
            <button class="btn btn-ghost" id="btnExport" disabled>📊 Export Excel</button>
            <button class="btn btn-primary" id="btnNew">+ New Assessment</button>
          </div>
        </div>

        <div class="filters">
          <select class="select" id="courseFilter" style="max-width: 320px;">
            <option value="">All my courses</option>
          </select>
          <select class="select" id="typeFilter" style="max-width: 180px;">
            <option value="">All types</option>
            <option value="assignment">Assignment</option>
            <option value="test">Test</option>
            <option value="ca">CA</option>
            <option value="exam">Exam</option>
          </select>
          <button class="btn btn-ghost btn-sm" id="btnReset">Reset</button>
        </div>

        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>Course</th>
                <th>Type</th>
                <th>Title</th>
                <th>Max Score</th>
                <th>Weight</th>
                <th>Scored</th>
                <th>Due Date</th>
                <th style="text-align:right;">Actions</th>
              </tr>
            </thead>
            <tbody id="tbody">
              <tr><td colspan="8"><div class="skeleton" style="height:22px;"></div></td></tr>
            </tbody>
          </table>
        </div>

      </main>
    </div>
  </div>

  <div id="modalRoot"></div>

  <script src="/js/sidebar.js"></script>
  <script src="/js/topbar.js"></script>
  <script src="/js/admin/crud-shared.js"></script>
  <script src="/js/lecturer/assessments.js"></script>
</body>
</html>
