<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — SMARTACADEMIC</title>
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body data-page="reset">

<div class="auth-shell">

  <aside class="auth-brand">
    <div class="auth-brand-top">
      <a href="/" class="brand">
        <span class="brand-mark">S</span>
        <span class="brand-name">SMART<span>ACADEMIC</span></span>
      </a>
    </div>

    <div class="auth-brand-body">
      <h1>Set a new password.</h1>
      <p>Choose something strong that you haven't used before.</p>

      <ul class="auth-brand-points">
        <li><span class="chk">✓</span> At least 6 characters</li>
        <li><span class="chk">✓</span> Mix letters &amp; numbers</li>
        <li><span class="chk">✓</span> Never share it</li>
      </ul>
    </div>

    <div class="auth-brand-bottom">
      © <span id="year"></span> SMARTACADEMIC
    </div>
  </aside>

  <main class="auth-form-wrap">
    <form class="auth-form" id="resetForm" novalidate>
      <div class="auth-form-head">
        <h2>Choose new password</h2>
        <p>Enter and confirm your new password below.</p>
      </div>

      <div class="msg" id="resetMsg"></div>

      <input type="hidden" id="token" />

      <div class="field">
        <label for="password">New password <span class="req">*</span></label>
        <div class="pw-wrap">
          <input type="password" id="password" class="input" placeholder="At least 6 characters" autocomplete="new-password" required />
          <button type="button" class="pw-toggle" data-target="password">Show</button>
        </div>
      </div>

      <div class="field">
        <label for="confirm">Confirm password <span class="req">*</span></label>
        <div class="pw-wrap">
          <input type="password" id="confirm" class="input" placeholder="Repeat password" autocomplete="new-password" required />
          <button type="button" class="pw-toggle" data-target="confirm">Show</button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" id="resetBtn">Reset password</button>

      <div class="auth-footer">
        <a href="/login.html" class="link">Back to sign in</a>
      </div>

      <a href="/" class="back-home">← Back to home</a>
    </form>
  </main>
</div>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
<script src="/js/auth.js"></script>
</body>
</html>
