<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Performance — HOD</title>
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/topbar.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebarSlot"></div>
    <div class="main">
      <div id="topbarSlot"></div>
      <main class="page">
        <div class="page-header"><div><h1>Performance Analytics</h1><p>Department-wide academic performance.</p></div></div>

        <div class="card mb-4">
          <div class="card-header"><div><h3>GPA by Level</h3></div></div>
          <div class="table-wrap" style="box-shadow:none;border:none;">
            <table class="table">
              <thead><tr><th>Level</th><th>Students</th><th>Avg GPA</th></tr></thead>
              <tbody id="levelBody"><tr><td colspan="3"><div class="skeleton" style="height:20px;"></div></td></tr></tbody>
            </table>
          </div>
        </div>

        <div class="grid-2">
          <div class="card">
            <div class="card-header"><div><h3>Top Performers</h3></div></div>
            <div class="table-wrap" style="box-shadow:none;border:none;">
              <table class="table">
                <thead><tr><th>Student</th><th>Level</th><th>GPA</th></tr></thead>
                <tbody id="topBody"><tr><td colspan="3"><div class="skeleton" style="height:20px;"></div></td></tr></tbody>
              </table>
            </div>
          </div>

          <div class="card">
            <div class="card-header"><div><h3>Most Failed Courses</h3></div></div>
            <div class="table-wrap" style="box-shadow:none;border:none;">
              <table class="table">
                <thead><tr><th>Course</th><th>Failures</th></tr></thead>
                <tbody id="failBody"><tr><td colspan="2"><div class="skeleton" style="height:20px;"></div></td></tr></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="/js/sidebar.js"></script>
  <script src="/js/topbar.js"></script>
  <script src="/js/admin/crud-shared.js"></script>
  <script src="/js/hod/performance.js"></script>
</body>
</html>
