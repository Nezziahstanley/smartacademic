<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Result Submissions — SMARTACADEMIC HOD</title>
  <link rel="icon" type="image/png" href="/assets/images/fpu-logo.png" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/topbar.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <style>
    .cb-cell { width: 44px; text-align: center; }
    .cb-cell input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary); }
    .bulk-bar {
      display: none;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      background: linear-gradient(135deg, #f0fdf4, #dcfce7);
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .bulk-bar.active { display: flex; }
    .bulk-bar .bulk-info { flex: 1; font-size: 14px; color: #166534; font-weight: 600; }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="sidebarSlot"></div>
    <div class="main">
      <div id="topbarSlot"></div>
      <main class="page">

        <div class="page-header">
          <div>
            <h1>Result Submissions</h1>
            <p>Review and approve results submitted by lecturers.</p>
          </div>
        </div>

        <div class="filters">
          <select class="select" id="statusFilter" style="max-width:220px;">
            <option value="submitted" selected>Pending Review</option>
            <option value="approved">Approved</option>
            <option value="returned">Returned</option>
          </select>
        </div>

        <div class="bulk-bar" id="bulkBar">
          <div class="bulk-info">
            <strong id="bulkCount">0</strong> course(s) selected
          </div>
          <button class="btn btn-primary btn-sm" id="btnBulkApprove">✓ Approve All</button>
          <button class="btn btn-danger btn-sm" id="btnBulkReturn">↩ Return Selected</button>
          <button class="btn btn-ghost btn-sm" id="btnBulkClear">Clear</button>
        </div>

        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th class="cb-cell"><input type="checkbox" id="checkAll" /></th>
                <th>Course</th>
                <th>Lecturer</th>
                <th>Session</th>
                <th>Semester</th>
                <th>Students</th>
                <th>Submitted</th>
                <th style="text-align:right;">Actions</th>
              </tr>
            </thead>
            <tbody id="tbody">
              <tr><td colspan="8"><div class="skeleton" style="height:22px;"></div></td></tr>
            </tbody>
          </table>
        </div>

      </main>
    </div>
  </div>

  <script src="/js/sidebar.js"></script>
  <script src="/js/topbar.js"></script>
  <script src="/js/admin/crud-shared.js"></script>
  <script src="/js/hod/result-submissions.js"></script>
</body>
</html>
