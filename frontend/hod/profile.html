<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile — SMARTACADEMIC HOD</title>
  <link rel="icon" type="image/png" href="/assets/images/fpu-logo.png" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/topbar.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>

  <div class="app-shell">
    <div id="sidebarSlot"></div>
    <div class="main">
      <div id="topbarSlot"></div>
      <main class="page">

        <div class="page-header">
          <div>
            <h1>My Profile</h1>
            <p>View and edit your HOD account details.</p>
          </div>
        </div>

        <!-- PROFILE PHOTO -->
        <div class="card mb-4">
          <div class="card-header">
            <div>
              <h3>Profile Photo</h3>
              <p>This photo appears in your topbar across all pages.</p>
            </div>
          </div>

          <div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap;">
            <div id="photoPreview"
                 style="width:110px;height:110px;border-radius:50%;
                        background:linear-gradient(135deg,#166534,#ca8a04);
                        display:grid;place-items:center;color:#fff;
                        font-size:36px;font-weight:800;overflow:hidden;
                        background-size:cover;background-position:center;
                        border:3px solid #fff;
                        box-shadow:0 8px 24px rgba(22,101,52,.2);">?</div>

            <div style="flex:1;min-width:240px;">
              <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;">
                <button type="button" class="btn btn-primary" id="btnUploadPhoto">📷 Upload New Photo</button>
                <button type="button" class="btn btn-ghost" id="btnRemovePhoto" style="display:none;">🗑️ Remove</button>
              </div>
              <p style="font-size:13px;color:var(--ink-3);line-height:1.6;margin:0;">
                Max 2 MB • JPG or PNG • Square image (400×400 px or larger)
              </p>
            </div>
          </div>
        </div>
        <input type="file" id="photoInput" accept="image/*" style="display:none;" />

        <!-- PROFILE + PASSWORD -->
        <div class="grid-2">
          <div class="card">
            <div class="card-header"><div><h3>Profile Information</h3></div></div>
            <div id="profileCard"><div class="skeleton" style="height:150px;"></div></div>
          </div>

          <div class="card" id="change-password">
            <div class="card-header"><div><h3>Change Password</h3><p>Use a strong password.</p></div></div>
            <div class="msg" id="pwMsg"></div>
            <form id="pwForm">
              <div class="field"><label>Current password *</label>
                <input class="input" id="pwCurrent" type="password" required /></div>
              <div class="field"><label>New password *</label>
                <input class="input" id="pwNew" type="password" required /></div>
              <div class="field"><label>Confirm new password *</label>
                <input class="input" id="pwConfirm" type="password" required /></div>
              <button type="submit" class="btn btn-primary w-full" id="pwBtn">Change Password</button>
            </form>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="/js/sidebar.js"></script>
  <script src="/js/topbar.js"></script>
  <script src="/js/admin/crud-shared.js"></script>
  <script src="/js/hod/profile.js"></script>
</body>
</html>
