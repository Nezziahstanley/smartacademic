<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Results — SMARTACADEMIC Admin</title>
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/topbar.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebarSlot"></div>
    <div class="main">
      <div id="topbarSlot"></div>
      <main class="page">
        <div class="page-header">
          <div><h1>Results</h1><p>View, edit, and publish student results.</p></div>
        </div>

        <div class="filters">
          <select class="select" id="courseFilter" style="max-width:280px;"><option value="">All courses</option></select>
          <div class="search"><input type="search" id="searchInput" placeholder="Search by student or matric..." /></div>
          <button class="btn btn-ghost btn-sm" id="btnReset">Reset</button>
        </div>

        <div class="table-wrap">
          <table class="table">
            <thead><tr>
              <th>Student</th><th>Course</th><th>CA</th><th>Exam</th><th>Total</th>
              <th>Grade</th><th>Status</th><th style="text-align:right;">Actions</th>
            </tr></thead>
            <tbody id="tbody"><tr><td colspan="8"><div class="skeleton" style="height:22px;"></div></td></tr></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>
  <div id="modalRoot"></div>
  <script src="/js/sidebar.js"></script>
  <script src="/js/topbar.js"></script>
  <script src="/js/admin/crud-shared.js"></script>
  <script src="/js/admin/results.js"></script>
</body>
</html>
