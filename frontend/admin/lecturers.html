<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lecturers — SMARTACADEMIC Admin</title>
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/topbar.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebarSlot"></div>
    <div class="main">
      <div id="topbarSlot"></div>
      <main class="page">

        <div class="page-header">
          <div>
            <h1>Lecturers</h1>
            <p>Teaching staff, grouped by department.</p>
          </div>
          <div class="page-actions">
            <button class="btn btn-ghost" id="btnExpandAll">↧ Expand all</button>
            <button class="btn btn-ghost" id="btnCollapseAll">↥ Collapse all</button>
            <button class="btn btn-primary" id="btnNew">+ New Lecturer</button>
          </div>
        </div>

        <div class="filters">
          <div class="search"><input type="search" id="searchInput" placeholder="Search by name or staff ID..." /></div>
          <button class="btn btn-ghost btn-sm" id="btnReset">Reset</button>
        </div>

        <div id="accordionHost">
          <div class="skeleton" style="height:80px;margin-bottom:12px;"></div>
          <div class="skeleton" style="height:80px;"></div>
        </div>

      </main>
    </div>
  </div>

  <div id="modalRoot"></div>

  <script src="/js/sidebar.js"></script>
  <script src="/js/topbar.js"></script>
  <script src="/js/admin/crud-shared.js"></script>
  <script src="/js/admin/accordion.js"></script>
  <script src="/js/admin/lecturers-grouped.js"></script>
</body>
</html>
