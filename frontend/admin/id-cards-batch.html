<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Batch ID Cards — SMARTACADEMIC Admin</title>
  <link rel="icon" type="image/png" href="/assets/images/fpu-logo.png" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/topbar.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <script src="/js/lib/qrcode.min.js"></script>
  <style>
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 18px;
    }

    .id-card {
      width: 100%;
      max-width: 340px;
      height: 214px;
      border-radius: 14px;
      background: linear-gradient(135deg, #166534 0%, #ca8a04 100%);
      color: #fff;
      padding: 14px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(22,101,52,0.18);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .id-card::before {
      content: ""; position: absolute;
      width: 180px; height: 180px; border-radius: 50%;
      background: rgba(255,255,255,0.08);
      top: -70px; right: -50px; pointer-events: none;
    }
    .id-card::after {
      content: ""; position: absolute;
      width: 140px; height: 140px; border-radius: 50%;
      background: rgba(255,255,255,0.06);
      bottom: -70px; left: -40px; pointer-events: none;
    }
    .id-top { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 12px; position: relative; z-index: 2; }
    .id-mark { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 6px; background: rgba(255,255,255,0.2); font-size: 12px; }

    .id-body { display: flex; gap: 10px; margin-top: 8px; align-items: flex-start; position: relative; z-index: 2; }
    .id-photo {
      width: 60px; height: 72px; border-radius: 8px;
      background: rgba(255,255,255,0.25);
      display: grid; place-items: center;
      font-size: 22px; font-weight: 800;
      flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.5);
      overflow: hidden;
      background-size: cover; background-position: center;
    }
    .id-info { flex: 1; min-width: 0; }
    .id-name { font-size: 13px; font-weight: 800; line-height: 1.2; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .id-role { font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.85; margin-bottom: 5px; }
    .id-detail { font-size: 9.5px; opacity: 0.92; line-height: 1.35; }

    .id-footer {
      position: absolute; bottom: 10px; left: 14px; right: 14px;
      display: flex; justify-content: space-between; align-items: flex-end;
      gap: 8px; z-index: 2;
    }
    .qr-box {
      width: 68px; height: 68px; background: #fff; border-radius: 7px; padding: 4px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15); flex-shrink: 0;
    }
    .qr-box canvas, .qr-box img, .qr-box svg { width: 100%; height: 100%; display: block; border-radius: 3px; }
    .qr-meta { display: flex; flex-direction: column; gap: 3px; margin-bottom: 3px; flex: 1; min-width: 0; }
    .qr-meta .scan-hint { font-size: 7.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; opacity: 0.9; }
    .qr-meta .matric { font-size: 9px; font-family: monospace; font-weight: 700; opacity: 0.95; word-break: break-all; }
    .id-valid { font-size: 8px; text-align: right; opacity: 0.85; flex-shrink: 0; }
    .id-valid strong { display: block; font-size: 9.5px; font-family: monospace; margin-top: 1px; }

    .id-card-skeleton {
      width: 100%; max-width: 340px; height: 214px; border-radius: 14px;
      background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
      background-size: 200% 100%;
      animation: sk 1.4s ease-in-out infinite;
    }
    @keyframes sk { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

    /* Print */
    @media print {
      @page { size: A4; margin: 8mm; }
      body * { visibility: hidden; }
      .print-target, .print-target * { visibility: visible; }
      body { background: #fff !important; }
      .print-target {
        position: absolute; top: 0; left: 0; right: 0;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 6mm;
      }
      .id-card {
        box-shadow: none;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
        page-break-inside: avoid;
      }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <div id="sidebarSlot"></div>
    <div class="main">
      <div id="topbarSlot"></div>
      <main class="page">

        <div class="page-header no-print">
          <div>
            <h1>Batch ID Cards</h1>
            <p>Students grouped by department. Expand to see cards, then print.</p>
          </div>
          <div class="page-actions">
            <button class="btn btn-ghost" id="btnExpandAll">↧ Expand all</button>
            <button class="btn btn-ghost" id="btnCollapseAll">↥ Collapse all</button>
            <button class="btn btn-primary" id="btnPrintAll">🖨️ Print All</button>
          </div>
        </div>

        <div id="accordionHost" class="no-print">
          <div class="skeleton" style="height:80px;margin-bottom:12px;"></div>
          <div class="skeleton" style="height:80px;"></div>
        </div>

        <!-- This div is what actually gets printed (populated on Print) -->
        <div id="printTarget" class="print-target" style="display:none;"></div>

      </main>
    </div>
  </div>

  <div id="modalRoot"></div>

  <script src="/js/sidebar.js"></script>
  <script src="/js/topbar.js"></script>
  <script src="/js/admin/crud-shared.js"></script>
  <script src="/js/admin/accordion.js"></script>
  <script>
    'use strict';
    (function () {
      const { $, api, esc, toast } = window.SACrud;
      const { mount } = window.SAAccordion;

      const state = {
        departments: [],
        students: [],
      };

      /* ============================================================
         LOAD
         ============================================================ */
      async function load() {
        const host = $('#accordionHost');
        host.innerHTML = '<div class="skeleton" style="height:80px;margin-bottom:12px;"></div><div class="skeleton" style="height:80px;"></div>';

        const [deptRes, studentsRes] = await Promise.all([
          api('/api/admin/departments/overview'),
          api('/api/admin/students?limit=1000'),
        ]);

        if (!deptRes.ok || !studentsRes.ok) {
          host.innerHTML = '<div class="empty" style="padding:40px;"><div class="empty-icon">⚠</div><h3>Failed to load</h3></div>';
          return;
        }

        state.departments = deptRes.data.data;
        state.students = studentsRes.data.data.items || [];

        const byDept = new Map();
        for (const s of state.students) {
          if (!byDept.has(s.department_id)) byDept.set(s.department_id, []);
          byDept.get(s.department_id).push(s);
        }

        const acc = mount(host, { pageKey: 'admin_id_cards' });

        const items = state.departments.map(d => {
          const list = byDept.get(d.id) || [];
          return {
            id: d.id,
            name: d.name,
            code: d.code,
            meta: { students: d.student_count },
            actionsHtml: `
              <button class="btn btn-primary btn-sm" data-print-dept="${d.id}">🖨️ Print</button>
            `,
            renderBody: () => renderCardsGrid(list),
            onBodyReady: (bd) => {
              // Render QR codes for this department's cards
              renderQrCodes(bd);
            },
          };
        });

        acc.render(items);

        document.querySelectorAll('[data-print-dept]').forEach(b =>
          b.addEventListener('click', (e) => {
            e.stopPropagation();
            printDepartment(parseInt(b.dataset.printDept, 10));
          }));
      }

      /* ============================================================
         RENDER CARDS GRID
         ============================================================ */
      function renderCardsGrid(students) {
        if (!students.length) {
          return `
            <div class="empty" style="padding:40px;">
              <div class="empty-icon">🎓</div>
              <h3>No students in this department</h3>
            </div>`;
        }

        return `
          <div style="padding:18px;">
            <div class="cards-grid" data-grid>
              ${students.map(s => renderCard(s)).join('')}
            </div>
          </div>`;
      }

      function renderCard(s) {
        const initials = (s.full_name || '?').split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
        const photoStyle = s.photo_url
          ? `background-image:url('${s.photo_url}');background-size:cover;background-position:center;color:transparent;`
          : '';
        const verifyUrl = `${location.origin}/verify.html?matric=${encodeURIComponent(s.matric_no)}`;

        return `
          <div class="id-card">
            <div class="id-top">
              <span class="id-mark">S</span>
              <span>SMARTACADEMIC</span>
            </div>
            <div class="id-body">
              <div class="id-photo" style="${photoStyle}">${s.photo_url ? '' : initials}</div>
              <div class="id-info">
                <div class="id-name">${esc(s.full_name)}</div>
                <div class="id-role">Student</div>
                <div class="id-detail">
                  ${esc(s.department_name || '')}<br>
                  ${esc(s.programme_name || '')} · Level ${s.level}
                </div>
              </div>
            </div>
            <div class="id-footer">
              <div class="qr-box"><div class="qr-target" data-url="${esc(verifyUrl)}"></div></div>
              <div class="qr-meta">
                <div class="scan-hint">📱 Scan to verify</div>
                <div class="matric">${esc(s.matric_no)}</div>
              </div>
              <div class="id-valid">
                <span>Valid From</span>
                <strong>${new Date().toLocaleDateString()}</strong>
              </div>
            </div>
          </div>`;
      }

      function renderQrCodes(container) {
        if (typeof QRCode === 'undefined') {
          console.warn('[id-cards] QRCode library not loaded');
          return;
        }
        container.querySelectorAll('.qr-target').forEach(el => {
          const url = el.dataset.url;
          if (!url || el.dataset.rendered) return;
          try {
            new QRCode(el, {
              text: url,
              width: 120,
              height: 120,
              colorDark: '#000000',
              colorLight: '#ffffff',
              correctLevel: QRCode.CorrectLevel.H,
            });
            el.dataset.rendered = '1';
            const img = el.querySelector('img, canvas');
            if (img) {
              img.style.width = '100%';
              img.style.height = '100%';
              img.style.display = 'block';
            }
          } catch (err) {
            console.warn('[id-cards qr]', err);
          }
        });
      }

      /* ============================================================
         PRINT
         ============================================================ */
      async function printDepartment(departmentId) {
        const dept = state.departments.find(d => d.id === departmentId);
        const students = state.students.filter(s => s.department_id === departmentId);
        if (!students.length) { toast('No students to print', 'error'); return; }
        await printCards(students, dept ? dept.name : '');
      }

      async function printAll() {
        if (!state.students.length) { toast('No students to print', 'error'); return; }
        await printCards(state.students, 'All Departments');
      }

      async function printCards(students, label) {
        toast(`⏳ Preparing ${students.length} card(s)...`);

        const target = $('#printTarget');
        target.innerHTML = students.map(renderCard).join('');
        renderQrCodes(target);

        // Give the QR library a moment to finish rendering into canvas/img
        await new Promise(r => setTimeout(r, 400));

        // Toggle print mode
        document.body.classList.add('print-mode');
        target.style.display = 'grid';

        // Try/catch so we always restore the UI
        try {
          window.print();
        } finally {
          setTimeout(() => {
            target.style.display = 'none';
            target.innerHTML = '';
            document.body.classList.remove('print-mode');
          }, 300);
        }
      }

      /* ============================================================
         GLOBAL CONTROLS
         ============================================================ */
      function bind() {
        $('#btnPrintAll').addEventListener('click', printAll);
        $('#btnExpandAll').addEventListener('click', () => {
          document.querySelectorAll('.dept-card').forEach(c => {
            if (!c.classList.contains('open')) c.querySelector('.dept-head')?.click();
          });
        });
        $('#btnCollapseAll').addEventListener('click', () => {
          document.querySelectorAll('.dept-card.open').forEach(c =>
            c.querySelector('.dept-head')?.click());
        });
      }

      function boot() {
        if (window.__adminIdCardsBooted) return;
        window.__adminIdCardsBooted = true;
        bind();
        load();
      }

      document.addEventListener('sa:layout-ready', boot);
      setTimeout(boot, 1500);
    })();
  </script>
</body>
</html>
