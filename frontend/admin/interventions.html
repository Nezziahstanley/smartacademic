<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interventions — SMARTACADEMIC Admin</title>
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/topbar.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebarSlot"></div>
    <div class="main">
      <div id="topbarSlot"></div>
      <main class="page">
        <div class="page-header">
          <div><h1>Interventions</h1><p>Assign and monitor student support interventions.</p></div>
          <div class="page-actions">
            <button class="btn btn-primary" id="btnNew">+ New Intervention</button>
          </div>
        </div>

        <div class="filters">
          <select class="select" id="statusFilter" style="max-width:160px;">
            <option value="">All status</option>
            <option value="Pending">Pending</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
            <option value="Closed">Closed</option>
          </select>
          <select class="select" id="priorityFilter" style="max-width:150px;">
            <option value="">All priorities</option>
            <option value="low">Low</option><option value="medium">Medium</option>
            <option value="high">High</option><option value="critical">Critical</option>
          </select>
          <select class="select" id="typeFilter" style="max-width:220px;">
            <option value="">All types</option>
            <option value="academic_counselling">Academic counselling</option>
            <option value="tutorial_recommendation">Tutorial recommendation</option>
            <option value="lecturer_meeting">Lecturer meeting</option>
            <option value="hod_meeting">HOD meeting</option>
            <option value="attendance_improvement">Attendance improvement</option>
            <option value="study_support">Study support</option>
            <option value="course_advisory">Course advisory</option>
            <option value="other">Other</option>
          </select>
          <div class="search"><input type="search" id="searchInput" placeholder="Search..." /></div>
          <button class="btn btn-ghost btn-sm" id="btnReset">Reset</button>
        </div>

        <div class="table-wrap">
          <table class="table">
            <thead><tr>
              <th>Student</th><th>Title</th><th>Type</th><th>Assigned</th>
              <th>Priority</th><th>Status</th><th>Due</th>
              <th style="text-align:right;">Actions</th>
            </tr></thead>
            <tbody id="tbody"><tr><td colspan="8"><div class="skeleton" style="height:22px;"></div></td></tr></tbody>
          </table>
        </div>

        <div class="pagination" id="pagination">
          <span id="paginationInfo">—</span>
          <div class="pages" id="paginationButtons"></div>
        </div>
      </main>
    </div>
  </div>
  <div id="modalRoot"></div>
  <script src="/js/sidebar.js"></script>
  <script src="/js/topbar.js"></script>
  <script src="/js/admin/crud-shared.js"></script>
  <script src="/js/admin/interventions.js"></script>
</body>
</html>
