<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pending Approvals — SMARTACADEMIC Admin</title>
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/topbar.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>

  <div class="app-shell">
    <div id="sidebarSlot"></div>

    <div class="main">
      <div id="topbarSlot"></div>

      <main class="page">

        <div class="page-header">
          <div>
            <h1>Pending Approvals</h1>
            <p>Students who registered and are awaiting activation.</p>
          </div>
        </div>

        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Matric</th>
                <th>Department</th>
                <th>Programme</th>
                <th>Level</th>
                <th>Registered</th>
                <th style="text-align:right;">Actions</th>
              </tr>
            </thead>
            <tbody id="tbody">
              <tr><td colspan="8"><div class="skeleton" style="height:22px;"></div></td></tr>
            </tbody>
          </table>
        </div>

      </main>
    </div>
  </div>

  <div id="modalRoot"></div>

  <script src="/js/sidebar.js"></script>
  <script src="/js/topbar.js"></script>
  <script src="/js/admin/crud-shared.js"></script>
  <script src="/js/admin/pending-users.js"></script>
</body>
</html>
