<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Publish Results — SMARTACADEMIC Admin</title>
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/topbar.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebarSlot"></div>
    <div class="main">
      <div id="topbarSlot"></div>
      <main class="page">

        <div class="page-header">
          <div>
            <h1>Publish Results</h1>
            <p>Publish HOD-approved results so students can see them.</p>
          </div>
        </div>

        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th>Course</th>
                <th>Department</th>
                <th>Session</th>
                <th>Semester</th>
                <th>Students</th>
                <th>Approved</th>
                <th style="text-align:right;">Actions</th>
              </tr>
            </thead>
            <tbody id="tbody">
              <tr><td colspan="7"><div class="skeleton" style="height:22px;"></div></td></tr>
            </tbody>
          </table>
        </div>

      </main>
    </div>
  </div>

  <script src="/js/sidebar.js"></script>
  <script src="/js/topbar.js"></script>
  <script src="/js/admin/crud-shared.js"></script>
  <script>
    'use strict';
    (function () {
      const token = localStorage.getItem('sa_token');
      function $ (s) { return document.querySelector(s); }
      function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

      async function api(p, opts = {}) {
        const r = await fetch(p, {
          headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
          ...opts,
        });
        return { ok: r.ok, data: await r.json().catch(() => null) };
      }

      async function load() {
        const tbody = $('#tbody');
        tbody.innerHTML = '<tr><td colspan="7"><div class="skeleton" style="height:22px;"></div></td></tr>';

        const { ok, data } = await api('/api/admin/publish/result-submissions?status=approved');
        if (!ok) { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--red);">Failed.</td></tr>'; return; }

        if (!data.data.length) {
          tbody.innerHTML = '<tr><td colspan="7"><div class="empty" style="padding:40px;"><div class="empty-icon">📤</div><h3>No approved results</h3></div></td></tr>';
          return;
        }

        tbody.innerHTML = data.data.map(s => `
          <tr>
            <td><strong>${esc(s.code)}</strong> — ${esc(s.title)}</td>
            <td>${esc(s.department_name)}</td>
            <td>${esc(s.session_name)}</td>
            <td>${esc(s.semester_name)}</td>
            <td>${s.students}</td>
            <td>${s.approved_at ? new Date(s.approved_at).toLocaleString() : '—'}</td>
            <td>
              <div class="actions">
                <button class="btn btn-primary btn-sm" data-pub="${s.course_id}" data-session="${s.session_id}" data-semester="${s.semester_id}">📤 Publish</button>
              </div>
            </td>
          </tr>`).join('');

        tbody.querySelectorAll('[data-pub]').forEach(b =>
          b.addEventListener('click', async () => {
            if (!confirm('Publish results for this course?')) return;
            const { ok, data } = await api(`/api/admin/publish/${b.dataset.pub}`, {
              method: 'POST',
              body: JSON.stringify({ session_id: parseInt(b.dataset.session, 10), semester_id: parseInt(b.dataset.semester, 10) }),
            });
            if (!ok) { alert(data?.error || 'Failed'); return; }
            alert(data.message || 'Published');
            load();
          }));
      }

      document.addEventListener('sa:layout-ready', load);
    })();
  </script>
</body>
</html>
