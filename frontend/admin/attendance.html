<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance — SMARTACADEMIC Admin</title>
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/topbar.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebarSlot"></div>
    <div class="main">
      <div id="topbarSlot"></div>
      <main class="page">
        <div class="page-header">
          <div><h1>Attendance</h1><p>System-wide attendance records.</p></div>
        </div>

        <div class="stat-grid" id="summaryGrid">
          <div class="stat"><div class="stat-icon primary">📊</div><div class="stat-body"><div class="stat-value" id="s_total">—</div><div class="stat-label">Total Records</div></div></div>
          <div class="stat"><div class="stat-icon green">✓</div><div class="stat-body"><div class="stat-value" id="s_present">—</div><div class="stat-label">Present</div></div></div>
          <div class="stat"><div class="stat-icon red">✕</div><div class="stat-body"><div class="stat-value" id="s_absent">—</div><div class="stat-label">Absent</div></div></div>
          <div class="stat"><div class="stat-icon yellow">!</div><div class="stat-body"><div class="stat-value" id="s_pct">—</div><div class="stat-label">Present %</div></div></div>
        </div>

        <div class="filters">
          <select class="select" id="courseFilter" style="max-width:280px;"><option value="">All courses</option></select>
          <input class="input" id="fromDate" type="date" style="max-width:160px;" />
          <input class="input" id="toDate" type="date" style="max-width:160px;" />
          <button class="btn btn-ghost btn-sm" id="btnReset">Reset</button>
        </div>

        <div class="table-wrap">
          <table class="table">
            <thead><tr>
              <th>Date</th><th>Course</th><th>Student</th><th>Matric</th><th>Status</th>
            </tr></thead>
            <tbody id="tbody"><tr><td colspan="5"><div class="skeleton" style="height:22px;"></div></td></tr></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>
  <script src="/js/sidebar.js"></script>
  <script src="/js/topbar.js"></script>
  <script src="/js/admin/crud-shared.js"></script>
  <script src="/js/admin/attendance.js"></script>
</body>
</html>
