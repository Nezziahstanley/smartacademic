<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Results — Student</title>
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/topbar.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
  <div class="app-shell">
    <div id="sidebarSlot"></div>
    <div class="main">
      <div id="topbarSlot"></div>
      <main class="page">
        <div class="page-header">
          <div><h1>My Results</h1><p>All published results and semester GPA summary.</p></div>
        </div>

        <div class="card mb-4">
          <div class="card-header"><div><h3>GPA per Semester</h3><p>Running CGPA across all terms</p></div></div>
          <div id="gpaSummary">
            <div class="skeleton" style="height:60px;"></div>
          </div>
        </div>

        <div class="card">
          <div class="card-header"><div><h3>All Results</h3></div></div>
          <div class="table-wrap" style="box-shadow:none;border:none;">
            <table class="table">
              <thead>
                <tr>
                  <th>Course</th><th>Units</th><th>CA</th><th>Exam</th>
                  <th>Total</th><th>Grade</th><th>Point</th><th>Session</th>
                </tr>
              </thead>
              <tbody id="tbody">
                <tr><td colspan="8"><div class="skeleton" style="height:22px;"></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="/js/sidebar.js"></script>
  <script src="/js/topbar.js"></script>
  <script src="/js/admin/crud-shared.js"></script>
  <script src="/js/student/my-results.js"></script>
</body>
</html>
